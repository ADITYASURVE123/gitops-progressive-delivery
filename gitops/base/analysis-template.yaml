apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: metric-analysis
  namespace: app-monitoring
spec:
  args:
  - name: service
  - name: metricWindow
    value: "5m"
  - name: minSamples
    value: "100"
  - name: successRateThreshold
    value: "0.99"
  - name: latencyThreshold
    value: "0.5"
  metrics:
  - name: success-rate
    interval: 30s
    count: 5
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{status=~"2.*"}[{{args.metricWindow}}]))
          /
          sum(rate(http_requests_total[{{args.metricWindow}}]))
