apiVersion: argoproj.io/v1beta1
kind: Rollout
metadata:
  name: api-rollout-canary
  namespace: app-monitoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        version: canary
    spec:
      containers:
      - name: api
        image: ghcr.io/ADITYASURVE123/api-service:latest-canary
        ports:
        - containerPort: 8080
        env:
        - name: FAIL_RATE
          value: "0.0"
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 3
  strategy:
    canary:
      steps:
      - setWeight: 20
        pause: { duration: 60s }
      - analysis:
          templates:
          - templateName: metric-analysis
          args:
          - name: service
            value: api-canary
          - name: metricWindow
            value: 5m
          - name: minSamples
            value: "100"
          - name: successRateThreshold
            value: "0.99"
          - name: latencyThreshold
            value: "0.5"
        pause: { duration: 60s }
      - setWeight: 40
        pause: { duration: 60s }
      - analysis:
          templates:
          - templateName: metric-analysis
          args:
          - name: service
            value: api-canary
          - name: metricWindow
            value: 5m
          - name: minSamples
            value: "100"
          - name: successRateThreshold
            value: "0.99"
          - name: latencyThreshold
            value: "0.5"
        pause: { duration: 60s }
      - setWeight: 60
        pause: { duration: 60s }
      - analysis:
          templates:
          - templateName: metric-analysis
          args:
          - name: service
            value: api-canary
          - name: metricWindow
            value: 5m
          - name: minSamples
            value: "100"
          - name: successRateThreshold
            value: "0.99"
          - name: latencyThreshold
            value: "0.5"
        pause: { duration: 60s }
      - setWeight: 100
        pause: { duration: 300s }
      abortOnFailure: true
      maxSurge: 1
      maxUnavailable: 0
      trafficRouting:
        nginx:
          stableService: api-stable-service
          canaryService: api-canary-service
  template:
    metadata:
      labels:
        app: api
        version: canary
    spec:
      containers:
      - name: api
        image: ghcr.io/ADITYASURVE123/api-service:latest-canary
        ports:
        - containerPort: 8080
        env:
        - name: FAIL_RATE
          value: "0.0"
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 3